<!-- ================================= APP ================================= -->
<div class="device">
<main class="viewport" id="viewport">

  <!-- ------------------------------- LOGIN ------------------------------- -->
  <section class="screen screen--plain is-active" id="screen-login" data-screen="login">
    <div class="login">
      <div class="login__brand">
        <h1 class="login__name">Privat<span>Bank</span></h1>
        <p class="login__tagline" data-i18n="app.tagline"></p>
      </div>

      <div class="login__scanner">
        <button class="fp" id="btn-biometric" type="button" aria-live="polite">
          <svg class="fp__ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="fp__ring-track" cx="60" cy="60" r="54"/>
            <circle class="fp__ring-bar" cx="60" cy="60" r="54"/>
          </svg>
          <span class="fp__pulse" aria-hidden="true"></span>
          <span class="fp__pulse fp__pulse--2" aria-hidden="true"></span>
          <span class="fp__icon">
            <svg class="ico ico--fp" viewBox="0 0 24 24"><use href="#i-fingerprint"/></svg>
            <svg class="ico ico--ok" viewBox="0 0 24 24"><use href="#i-check"/></svg>
          </span>
        </button>
        <p class="login__status" id="login-status" data-i18n="login.hint"></p>
      </div>

      <div class="login__actions">
        <button class="btn btn--primary btn--block" id="btn-login" type="button">
          <svg class="btn__ico" viewBox="0 0 24 24"><use href="#i-fingerprint"/></svg>
          <span data-i18n="login.button"></span>
        </button>
        <button class="btn btn--ghost btn--block" data-soon type="button" data-i18n="login.alt"></button>

        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-switch__btn" data-lang="ua" type="button">UA</button>
          <button class="lang-switch__btn" data-lang="en" type="button">EN</button>
        </div>
      </div>

      <p class="login__legal" data-i18n="login.copyright"></p>
    </div>
  </section>

  <!-- ------------------------------ LOADING ------------------------------ -->
  <section class="screen screen--plain" id="screen-loading" data-screen="loading">
    <div class="loader">
      <div class="markwrap" aria-hidden="true">
        <span class="markwrap__halo"></span>
        <svg class="markwrap__orbit" viewBox="0 0 140 140">
          <circle class="markwrap__orbit-track" cx="70" cy="70" r="63"/>
          <circle class="markwrap__orbit-arc" cx="70" cy="70" r="63"/>
        </svg>
        <span class="mark mark--lg mark--animated">
          <svg class="mark__glyph" viewBox="0 0 100 100">
            <path class="mark__stroke" pathLength="100"
                  d="M35 82 V22 H57 a17 17 0 0 1 0 34 H35"/>
          </svg>
          <span class="mark__dot"></span>
        </span>
      </div>
      <p class="loader__title" data-i18n="loading.title"></p>
      <p class="loader__sub" id="load-sub" data-i18n="loading.sub"></p>
      <div class="progress"><div class="progress__bar" id="load-progress"></div></div>
    </div>
  </section>

  <!-- ----------------------------- DASHBOARD ----------------------------- -->
  <section class="screen screen--scroll" id="screen-dashboard" data-screen="dashboard">
    <header class="topbar">
      <div class="topbar__user">
        <div class="avatar" id="avatar">ОК</div>
        <div class="topbar__hello">
          <span class="topbar__greeting" data-i18n="dash.greeting"></span>
          <strong class="topbar__name" id="user-name"></strong>
        </div>
      </div>
      <div class="topbar__tools">
        <button class="icon-btn" data-go="notifications" type="button" aria-label="Notifications">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-bell"/></svg>
          <span class="badge" id="badge-top" hidden></span>
        </button>
        <button class="lang-pill" data-lang-toggle type="button"><span id="lang-label">EN</span></button>
      </div>
    </header>

    <div class="screen__body">
      <button class="bankcard" id="bankcard-main" type="button">
        <span class="bankcard__shine" aria-hidden="true"></span>
        <span class="bankcard__row bankcard__row--top">
          <span class="bankcard__brand">
            <span class="mark mark--sm mark--onCard" aria-hidden="true">
              <svg class="mark__glyph" viewBox="0 0 100 100">
                <path class="mark__stroke" pathLength="100"
                      d="M35 82 V22 H57 a17 17 0 0 1 0 34 H35"/>
              </svg>
              <span class="mark__dot"></span>
            </span>
            <span class="bankcard__brandtext">Privat<b>Bank</b></span>
          </span>
          <span class="bankcard__type" data-i18n="card.type"></span>
        </span>
        <span class="bankcard__chip" aria-hidden="true"></span>
        <svg class="bankcard__nfc" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6a8 8 0 0 1 0 12M12 3a12 12 0 0 1 0 18M4.5 9a4 4 0 0 1 0 6"/>
        </svg>
        <span class="bankcard__row bankcard__row--mid">
          <span class="bankcard__number" id="card-number"></span>
          <span class="bankcard__valid">
            <small data-i18n="card.valid"></small>
            <b id="card-valid"></b>
          </span>
        </span>
        <span class="bankcard__row bankcard__row--bottom">
          <span class="bankcard__balance">
            <small data-i18n="card.balanceLabel"></small>
            <b id="card-balance"></b>
          </span>
          <span class="bankcard__mark" aria-hidden="true"><i></i><i></i></span>
        </span>
      </button>

      <nav class="quick">
        <button class="quick__item" data-go="transfer" type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-send"/></svg></span>
          <span data-i18n="action.transfer"></span>
        </button>
        <button class="quick__item" data-go="topup" type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-plus"/></svg></span>
          <span data-i18n="action.topup"></span>
        </button>
        <button class="quick__item" data-go="payments" type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-doc"/></svg></span>
          <span data-i18n="action.payments"></span>
        </button>
        <button class="quick__item" data-scan="qr" type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-qr"/></svg></span>
          <span data-i18n="action.qr"></span>
        </button>
      </nav>

      <h2 class="section-title" data-i18n="dash.products"></h2>
      <div class="stack" id="dash-products"></div>

      <div class="section-head">
        <h2 class="section-title" data-i18n="dash.recent"></h2>
        <button class="link-btn" data-go="card" type="button" data-i18n="dash.showAll"></button>
      </div>
      <ul class="tx-list" id="dash-recent"></ul>
    </div>
  </section>

  <!-- ---------------------------- CARD DETAILS --------------------------- -->
  <section class="screen screen--scroll" id="screen-card" data-screen="card">
    <header class="topbar topbar--sub">
      <button class="icon-btn" data-back type="button" aria-label="Back">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
      </button>
      <h1 class="topbar__title" data-i18n="card.title"></h1>
      <button class="lang-pill" data-lang-toggle type="button"><span class="lang-label">EN</span></button>
    </header>

    <div class="screen__body">
      <div class="bankcard bankcard--static" id="bankcard-detail">
        <span class="bankcard__shine" aria-hidden="true"></span>
        <span class="bankcard__row bankcard__row--top">
          <span class="bankcard__brand">
            <span class="mark mark--sm mark--onCard" aria-hidden="true">
              <svg class="mark__glyph" viewBox="0 0 100 100">
                <path class="mark__stroke" pathLength="100"
                      d="M35 82 V22 H57 a17 17 0 0 1 0 34 H35"/>
              </svg>
              <span class="mark__dot"></span>
            </span>
            <span class="bankcard__brandtext">Privat<b>Bank</b></span>
          </span>
          <span class="bankcard__type" data-i18n="card.type"></span>
        </span>
        <span class="bankcard__chip" aria-hidden="true"></span>
        <svg class="bankcard__nfc" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6a8 8 0 0 1 0 12M12 3a12 12 0 0 1 0 18M4.5 9a4 4 0 0 1 0 6"/>
        </svg>
        <span class="bankcard__row bankcard__row--mid">
          <span class="bankcard__number" data-card-number></span>
          <span class="bankcard__secure">
            <span class="bankcard__cvv">
              <small data-i18n="card.cvv"></small>
              <b id="card-cvv"></b>
            </span>
            <span class="bankcard__valid">
              <small data-i18n="card.valid"></small>
              <b data-card-valid></b>
            </span>
          </span>
        </span>
        <button class="bankcard__eye" id="btn-reveal" type="button" aria-pressed="false">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-eye" id="reveal-icon"/></svg>
        </button>
        <span class="bankcard__row bankcard__row--bottom">
          <span class="bankcard__balance">
            <small data-i18n="card.balanceLabel"></small>
            <b data-card-balance></b>
          </span>
          <span class="bankcard__mark" aria-hidden="true"><i></i><i></i></span>
        </span>
      </div>

      <nav class="quick quick--card">
        <button class="quick__item" id="btn-statement" type="button">
          <span class="quick__ico quick__ico--solid"><svg class="ico" viewBox="0 0 24 24"><use href="#i-download"/></svg></span>
          <span data-i18n="card.statement"></span>
        </button>
        <button class="quick__item" data-soon type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-plus"/></svg></span>
          <span data-i18n="action.topup"></span>
        </button>
        <button class="quick__item" data-reveal type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-doc"/></svg></span>
          <span data-i18n="card.requisites"></span>
        </button>
        <button class="quick__item" data-soon type="button">
          <span class="quick__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-lock"/></svg></span>
          <span data-i18n="card.block"></span>
        </button>
      </nav>

      <h2 class="section-title" data-i18n="card.history"></h2>
      <div id="tx-history"></div>
    </div>
  </section>

  <!-- ------------------------- MODULE: TRANSFER --------------------------- -->
  <section class="screen screen--scroll" id="screen-transfer" data-screen="transfer">
    <header class="topbar topbar--sub">
      <button class="icon-btn" data-back type="button" aria-label="Back">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
      </button>
      <h1 class="topbar__title" data-i18n="tr.title"></h1>
      <span class="topbar__spacer" aria-hidden="true"></span>
    </header>
    <div class="screen__body" id="transfer-body"></div>
  </section>

  <!-- --------------------------- MODULE: TOP UP --------------------------- -->
  <section class="screen screen--scroll" id="screen-topup" data-screen="topup">
    <header class="topbar topbar--sub">
      <button class="icon-btn" data-back type="button" aria-label="Back">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
      </button>
      <h1 class="topbar__title" data-i18n="tu.title"></h1>
      <span class="topbar__spacer" aria-hidden="true"></span>
    </header>
    <div class="screen__body" id="topup-body"></div>
  </section>

  <!-- -------------------------- MODULE: PAYMENTS -------------------------- -->
  <section class="screen screen--scroll" id="screen-payments" data-screen="payments">
    <header class="topbar topbar--sub">
      <button class="icon-btn" data-back type="button" aria-label="Back">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
      </button>
      <h1 class="topbar__title" data-i18n="pay.title"></h1>
      <span class="topbar__spacer" aria-hidden="true"></span>
    </header>
    <div class="screen__body" id="payments-body"></div>
  </section>

  <!-- ----------------------------- PRODUCTS ------------------------------ -->
  <section class="screen screen--scroll" id="screen-products" data-screen="products">
    <header class="topbar topbar--sub topbar--flat">
      <h1 class="topbar__title topbar__title--left" data-i18n="products.title"></h1>
      <button class="lang-pill" data-lang-toggle type="button"><span class="lang-label">EN</span></button>
    </header>
    <div class="screen__body">
      <h2 class="section-title" data-i18n="products.mine"></h2>
      <div class="stack" id="products-mine"></div>
      <h2 class="section-title" data-i18n="products.offers"></h2>
      <div class="stack" id="products-offers"></div>
    </div>
  </section>

  <!-- --------------------------- NOTIFICATIONS --------------------------- -->
  <section class="screen screen--scroll" id="screen-notifications" data-screen="notifications">
    <header class="topbar topbar--sub topbar--flat">
      <h1 class="topbar__title topbar__title--left" data-i18n="notif.title"></h1>
      <button class="link-btn" id="btn-mark-read" type="button" data-i18n="notif.markAll"></button>
    </header>
    <div class="screen__body">
      <ul class="notif-list" id="notif-list"></ul>
    </div>
  </section>

  <!-- ------------------------------- MORE -------------------------------- -->
  <section class="screen screen--scroll" id="screen-more" data-screen="more">
    <header class="topbar topbar--sub topbar--flat">
      <h1 class="topbar__title topbar__title--left" data-i18n="more.title"></h1>
    </header>
    <div class="screen__body">
      <div class="profile-card">
        <div class="avatar avatar--lg" id="avatar-lg">ОК</div>
        <div>
          <strong class="profile-card__name" id="profile-name"></strong>
          <span class="profile-card__sub" data-i18n="more.client"></span>
        </div>
      </div>

      <ul class="menu">
        <li><button class="menu__row" data-soon type="button">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-user"/></svg></span>
          <span class="menu__text"><b data-i18n="more.profile"></b><small data-i18n="more.profileDesc"></small></span>
          <svg class="ico menu__chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button></li>
        <li><button class="menu__row" id="btn-reset-bio" type="button">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-shield"/></svg></span>
          <span class="menu__text"><b data-i18n="more.security"></b><small data-i18n="more.securityDesc"></small></span>
          <svg class="ico menu__chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button></li>
        <li><button class="menu__row" data-soon type="button">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-sliders"/></svg></span>
          <span class="menu__text"><b data-i18n="more.limits"></b><small data-i18n="more.limitsDesc"></small></span>
          <svg class="ico menu__chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button></li>
      </ul>

      <ul class="menu">
        <li><div class="menu__row menu__row--static">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-globe"/></svg></span>
          <span class="menu__text"><b data-i18n="more.language"></b></span>
          <span class="lang-switch lang-switch--sm" role="group">
            <button class="lang-switch__btn" data-lang="ua" type="button">UA</button>
            <button class="lang-switch__btn" data-lang="en" type="button">EN</button>
          </span>
        </div></li>
        <li><div class="menu__row menu__row--static">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-moon"/></svg></span>
          <span class="menu__text"><b data-i18n="more.theme"></b></span>
          <button class="toggle" id="theme-toggle" type="button" role="switch" aria-checked="false">
            <span class="toggle__knob"></span>
          </button>
        </div></li>
      </ul>

      <ul class="menu">
        <li><button class="menu__row" data-soon type="button">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-headset"/></svg></span>
          <span class="menu__text"><b data-i18n="more.support"></b><small data-i18n="more.supportDesc"></small></span>
          <svg class="ico menu__chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button></li>
        <li><button class="menu__row" data-soon type="button">
          <span class="menu__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-info"/></svg></span>
          <span class="menu__text"><b data-i18n="more.about"></b><small data-i18n="more.aboutDesc"></small></span>
          <svg class="ico menu__chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button></li>
      </ul>

      <button class="btn btn--danger-ghost btn--block" id="btn-logout" type="button">
        <svg class="btn__ico" viewBox="0 0 24 24"><use href="#i-logout"/></svg>
        <span data-i18n="more.logout"></span>
      </button>
    </div>
  </section>

  <!-- ---------------------------- BOTTOM NAV ----------------------------- -->
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tabbar__item" data-tab="dashboard" type="button">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-home"/></svg>
      <span data-i18n="nav.home"></span>
    </button>
    <button class="tabbar__item" data-tab="products" type="button">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-grid"/></svg>
      <span data-i18n="nav.products"></span>
    </button>
    <button class="tabbar__item" data-tab="notifications" type="button">
      <span class="tabbar__ico-wrap">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-bell"/></svg>
        <span class="badge badge--tab" id="badge-tab" hidden></span>
      </span>
      <span data-i18n="nav.notifications"></span>
    </button>
    <button class="tabbar__item" data-tab="more" type="button">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-dots"/></svg>
      <span data-i18n="nav.more"></span>
    </button>
  </nav>

  <!-- ------------------------------ OVERLAYS ----------------------------- -->
  <div class="scrim" id="scrim" hidden></div>

  <!-- Statement period picker -->
  <div class="sheet" id="sheet-statement" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-statement-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h2 class="sheet__title" id="sheet-statement-title" data-i18n="statement.title"></h2>
    <p class="sheet__sub" data-i18n="statement.sub"></p>

    <div class="options" id="period-options">
      <button class="option is-selected" data-period="week" type="button">
        <span class="option__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-clock"/></svg></span>
        <span class="option__text"><b data-i18n="statement.week"></b><small data-i18n="statement.weekSub"></small></span>
        <span class="option__radio" aria-hidden="true"></span>
      </button>
      <button class="option" data-period="month" type="button">
        <span class="option__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-calendar"/></svg></span>
        <span class="option__text"><b data-i18n="statement.month"></b><small data-i18n="statement.monthSub"></small></span>
        <span class="option__radio" aria-hidden="true"></span>
      </button>
      <button class="option" data-period="custom" type="button">
        <span class="option__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-sliders"/></svg></span>
        <span class="option__text"><b data-i18n="statement.custom"></b><small data-i18n="statement.customSub"></small></span>
        <span class="option__radio" aria-hidden="true"></span>
      </button>
    </div>

    <div class="daterange" id="daterange" hidden>
      <label class="field">
        <span class="field__label" data-i18n="statement.from"></span>
        <input class="field__input" type="date" id="date-from">
      </label>
      <label class="field">
        <span class="field__label" data-i18n="statement.to"></span>
        <input class="field__input" type="date" id="date-to">
      </label>
      <p class="field__error" id="date-error" hidden></p>
    </div>

    <button class="btn btn--primary btn--block" id="btn-generate" type="button">
      <svg class="btn__ico" viewBox="0 0 24 24"><use href="#i-download"/></svg>
      <span data-i18n="statement.generate"></span>
    </button>
    <button class="btn btn--ghost btn--block" data-close-sheet type="button" data-i18n="common.cancel"></button>
  </div>

  <!-- Product details -->
  <div class="sheet" id="sheet-product" hidden role="dialog" aria-modal="true">
    <div class="sheet__grip" aria-hidden="true"></div>
    <div id="sheet-product-body"></div>
    <button class="btn btn--ghost btn--block" data-close-sheet type="button" data-i18n="common.close"></button>
  </div>

  <!-- Exit confirmation, raised when an edge-swipe / back gesture would leave -->
  <div class="sheet" id="sheet-exit" hidden role="alertdialog" aria-modal="true" aria-labelledby="sheet-exit-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h2 class="sheet__title" id="sheet-exit-title" data-i18n="exit.title"></h2>
    <p class="sheet__sub" data-i18n="exit.text"></p>
    <button class="btn btn--primary btn--block" id="btn-stay" type="button" data-i18n="exit.stay"></button>
    <button class="btn btn--danger-ghost btn--block" id="btn-leave" type="button" data-i18n="exit.leave"></button>
  </div>

  <!-- Camera viewfinder for the quick actions (capture only, no decoding) -->
  <div class="scanner" id="scanner" hidden role="dialog" aria-modal="true">
    <video class="scanner__video" id="scanner-video" playsinline autoplay muted></video>
    <div class="scanner__shade" aria-hidden="true"></div>

    <header class="scanner__bar">
      <button class="icon-btn scanner__close" id="scanner-close" type="button" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
      <h2 class="scanner__title" id="scanner-title"></h2>
    </header>

    <div class="scanner__frame" id="scanner-frame" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
      <span class="scanner__laser"></span>
    </div>

    <p class="scanner__hint" id="scanner-hint"></p>

    <div class="scanner__error" id="scanner-error" hidden>
      <span class="scanner__error-ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-camera"/></svg></span>
      <strong id="scanner-error-title"></strong>
      <span id="scanner-error-text"></span>
      <button class="btn btn--primary" id="scanner-retry" type="button" data-i18n="scan.retry"></button>
    </div>
  </div>

  <!-- Blocking progress while the PDF is being built -->
  <div class="busy" id="busy" hidden>
    <div class="busy__box">
      <svg class="spinner spinner--sm" viewBox="0 0 50 50" aria-hidden="true">
        <circle class="spinner__track" cx="25" cy="25" r="20"/>
        <circle class="spinner__bar" cx="25" cy="25" r="20"/>
      </svg>
      <p class="busy__title" data-i18n="statement.generating"></p>
      <p class="busy__sub" data-i18n="statement.generatingSub"></p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</main>
</div>

<script src="js/i18n.js"></script>
<script src="js/format.js"></script>
<script src="js/data.js"></script>
<script src="js/biometrics.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/fonts-ptsans.js"></script>
<script src="js/statement.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
